{% extends 'base.html' %}
{% block title %}添加知识点{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card shadow-sm">
    <div class="card-header bg-info text-white"><h5 class="mb-0">添加知识点</h5></div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">知识点名称 *</label>
                    <input type="text" class="form-control" name="name" required placeholder="如：指令格式与寻址方式">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">编码 *</label>
                    <input type="text" class="form-control" name="code" required placeholder="如：CO_CH3_001">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">所属章节</label>
                    <input type="text" class="form-control" name="chapter" placeholder="如：第三章 指令系统">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">章节序号（排序用）</label>
                    <input type="number" class="form-control" name="chapter_order" value="1" min="1">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">难度 (1-5)</label>
                    <select class="form-select" name="difficulty">
                        <option value="1">1 ★ 很简单</option>
                        <option value="2">2 ★★ 简单</option>
                        <option value="3" selected>3 ★★★ 中等</option>
                        <option value="4">4 ★★★★ 较难</option>
                        <option value="5">5 ★★★★★ 很难</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">重要程度 (1-5)</label>
                    <select class="form-select" name="importance">
                        <option value="1">1 一般</option>
                        <option value="2">2 较重要</option>
                        <option value="3" selected>3 重要</option>
                        <option value="4">4 很重要</option>
                        <option value="5">5 核心</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">预计学习时长（分钟）</label>
                    <input type="number" class="form-control" name="estimated_minutes" value="30" min="5">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">描述</label>
                    <textarea class="form-control" name="description" rows="3" placeholder="知识点描述..."></textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">保存知识点</button>
                <a href="{{ url_for('admin.knowledge_point_list') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
