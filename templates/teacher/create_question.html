{% extends 'base.html' %}
{% block title %}创建题目{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card shadow-sm">
    <div class="card-header bg-success text-white"><h5 class="mb-0"><i class="bi bi-plus-square me-2"></i>创建测验题目</h5></div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">所属知识点 *</label>
                    <select class="form-select" name="kp_id" required>
                        <option value="">-- 选择知识点 --</option>
                        {% for kp in kps %}
                        <option value="{{ kp.id }}" {{ 'selected' if kp.id == selected_kp_id }}>
                            [{{ kp.chapter or '-' }}] {{ kp.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">题型</label>
                    <select class="form-select" name="question_type" id="qtype" onchange="toggleOptions()">
                        <option value="single">单选题</option>
                        <option value="multiple">多选题</option>
                        <option value="truefalse">判断题</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">题目内容 *</label>
                    <textarea class="form-control" name="question_text" rows="3" required
                              placeholder="请输入题目..."></textarea>
                </div>

                <!-- 选项区 -->
                <div class="col-12" id="optionsArea">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label">选项A</label>
                            <input type="text" class="form-control" name="option_a">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">选项B</label>
                            <input type="text" class="form-control" name="option_b">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">选项C</label>
                            <input type="text" class="form-control" name="option_c">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">选项D</label>
                            <input type="text" class="form-control" name="option_d">
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">正确答案 * <small class="text-muted">（如A / AB / T/F）</small></label>
                    <input type="text" class="form-control" name="correct_answer" required
                           placeholder="如: A 或 AB 或 T">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">难度</label>
                    <select class="form-select" name="difficulty">
                        <option value="1">1 基础</option>
                        <option value="2">2 简单</option>
                        <option value="3" selected>3 中等</option>
                        <option value="4">4 较难</option>
                        <option value="5">5 难</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">题目解析 <small class="text-muted">（选填，将在答题后展示）</small></label>
                    <textarea class="form-control" name="explanation" rows="2"
                              placeholder="答案解析..."></textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">保存题目</button>
                <a href="{{ url_for('teacher.question_list') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function toggleOptions() {
    const type = document.getElementById('qtype').value;
    document.getElementById('optionsArea').style.display = type === 'truefalse' ? 'none' : '';
}
</script>
{% endblock %}
